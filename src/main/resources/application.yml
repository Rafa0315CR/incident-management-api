spring:
  application:
    name: incident-management-api
  datasource:
    url: jdbc:h2:mem:incidents;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: never
