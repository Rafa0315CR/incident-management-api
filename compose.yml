services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
